<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#704B1C">
<title>Clinique Dentaire Spécialisée — Dr. Benharrats Khadidja</title>
<style>
:root {
  --brown:#704B1C;
  --brown-dark:#513513;
  --cream:#FBF7F0;
  --white:#FFFFFF;
  --text:#2F261B;
  --muted:#756B5D;
  --line:rgba(112,75,28,.14);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,255,255,.85), transparent 38%),
    var(--cream);
  color:var(--text);
}
.wrapper {
  width:min(100%, 620px);
  margin:auto;
  padding:28px 18px 34px;
}
.card {
  background:rgba(255,255,255,.72);
  border:1px solid var(--line);
  border-radius:30px;
  padding:22px 18px 20px;
  box-shadow:0 18px 55px rgba(64,42,17,.10);
  backdrop-filter: blur(10px);
}
.logo {
  display:block;
  width:min(100%, 390px);
  margin:0 auto 8px;
  border-radius:22px;
}
h1 {
  margin:6px 0 5px;
  text-align:center;
  font-size:clamp(21px,5vw,29px);
  line-height:1.15;
  letter-spacing:-.4px;
  color:var(--brown-dark);
}
.subtitle {
  text-align:center;
  margin:0 auto 18px;
  color:var(--muted);
  font-size:14px;
}
.info {
  display:flex;
  gap:10px;
  align-items:flex-start;
  justify-content:center;
  text-align:center;
  padding:12px 10px;
  margin-bottom:15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.62);
  font-size:13px;
  line-height:1.5;
}
.buttons { display:grid; gap:11px; }
a.btn {
  text-decoration:none;
  color:var(--brown-dark);
  background:var(--white);
  border:1px solid var(--line);
  border-radius:17px;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:13px 16px;
  font-weight:700;
  font-size:15px;
  box-shadow:0 5px 16px rgba(64,42,17,.06);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
a.btn:hover { transform:translateY(-2px); box-shadow:0 9px 22px rgba(64,42,17,.11); background:#fffdf9; }
a.primary { background:var(--brown); color:#fff; border-color:var(--brown); }
a.primary:hover { background:var(--brown-dark); color:#fff; }
.icon {
  width:28px; height:28px; display:grid; place-items:center;
  border-radius:9px; background:rgba(112,75,28,.09); font-size:16px;
}
.primary .icon { background:rgba(255,255,255,.15); }
.footer {
  text-align:center; margin-top:18px; color:#978B7A; font-size:11px;
}
@media (max-width:420px) {
  .wrapper { padding:14px 10px 24px; }
  .card { border-radius:24px; padding:16px 12px 16px; }
  .logo { border-radius:18px; }
}
</style>
</head>
